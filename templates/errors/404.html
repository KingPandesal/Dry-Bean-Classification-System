<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<!-- Main Background: Deep Slate Blue -->
<body class="bg-slate-900 flex items-center justify-center min-h-screen antialiased selection:bg-blue-500 selection:text-white">

    <!-- 404 Container -->
    <div class="w-full max-w-md p-8 text-center">
        
        <!-- Error Icon -->
        <div class="relative mb-8">
            <div class="mx-auto h-24 w-24 bg-slate-800 rounded-full flex items-center justify-center border border-slate-700">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <!-- Error Code -->
            <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 px-4 py-1 bg-blue-600 rounded-full">
                <span class="text-white font-bold text-sm">404</span>
            </div>
        </div>

        <!-- Text Content -->
        <h1 class="text-3xl font-bold text-white mb-3">Page Not Found</h1>
        <p class="text-slate-400 text-sm mb-8">
            Oops! The page you're looking for doesn't exist. It might have been moved or deleted.
        </p>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row gap-3 justify-center">

            {% if session.get("username") or session.get("guest") %}
            
            <button onclick="window.history.back()" class="px-6 py-3 bg-slate-800 border border-slate-700 hover:border-slate-600 text-slate-300 font-medium rounded-lg transition flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Go Back
            </button>

            {% else %}

            <a href="{{ url_for('main.home') }}" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                Go Home
            </a>

            {% endif %}

        </div>

    </div>

</body>
</html>
