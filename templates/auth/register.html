<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Dry Bean Classification System</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="bg-white flex items-center justify-center min-h-screen antialiased selection:bg-green-500 selection:text-white">

    <!-- REGISTER CARD -->
    <div class="w-full max-w-md p-8 mt-10 mb-10 bg-white rounded-2xl shadow-2xl border border-green-100">

        <!-- HEADER -->
        <div class="text-center mb-8">

            <div class="mx-auto h-12 w-12 bg-green-700 rounded-full flex items-center justify-center mb-4 shadow-lg shadow-green-200">

                <!-- Bean Icon -->
                🫘

            </div>

            <h2 class="text-2xl font-bold text-slate-900">
                Create Account
            </h2>

            <p class="text-slate-500 text-sm mt-2">
                Join the Dry Bean Classification System using Machine Learning
            </p>

        </div>

        {% if error %}
        <div class="mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-red-600 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <!-- FORM -->
        <form id="auth-form" action="{{ url_for('auth.register') }}" method="POST" class="space-y-5">

            <!-- Full Name -->
            <div>
                <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider">
                    Full Name
                </label>

                <input 
                    name="name" 
                    type="text" 
                    required 
                    placeholder="John Doe"
                    value="{{ form.name if form else '' }}"
                    class="mt-1 block w-full px-4 py-3 bg-white border border-green-100 rounded-lg text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-green-600 focus:border-green-600 transition">
            </div>

            <!-- Username -->
            <div>
                <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider">
                    Username
                </label>

                <input 
                    name="username" 
                    type="text" 
                    required 
                    placeholder="johndoe"
                    value="{{ form.username if form else '' }}"
                    class="mt-1 block w-full px-4 py-3 bg-white border border-green-100 rounded-lg text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-green-600 focus:border-green-600 transition">
            </div>

            <!-- Email -->
            <div>
                <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider">
                    Email Address
                </label>

                <input 
                    name="email" 
                    type="email" 
                    required 
                    placeholder="john@example.com"
                    value="{{ form.email if form else '' }}"
                    class="mt-1 block w-full px-4 py-3 bg-white border border-green-100 rounded-lg text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-green-600 focus:border-green-600 transition">
            </div>

            <!-- Password -->
            <div>
                <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider">
                    Password
                </label>

                <input 
                    name="password" 
                    type="password" 
                    required 
                    placeholder="••••••••"
                    class="mt-1 block w-full px-4 py-3 bg-white border border-green-100 rounded-lg text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-green-600 focus:border-green-600 transition">
            </div>

            <!-- Confirm Password -->
            <div>
                <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider">
                    Confirm Password
                </label>

                <input 
                    name="confirm-password" 
                    type="password" 
                    required 
                    placeholder="••••••••"
                    class="mt-1 block w-full px-4 py-3 bg-white border border-green-100 rounded-lg text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-green-600 focus:border-green-600 transition">
            </div>

            <!-- SUBMIT -->
            <button type="submit"
                class="w-full py-3 px-4 rounded-lg text-white font-medium bg-green-700 hover:bg-green-800 shadow-lg shadow-green-100 transition">
                Create Account
            </button>

        </form>

        <!-- GUEST -->
        <div class="mt-4">
            <a href="{{ url_for('auth.guest') }}"
               class="w-full flex justify-center py-3 px-4 border border-green-200 rounded-lg text-sm font-medium text-green-700 hover:bg-green-50 transition">
                Continue as Guest
            </a>
        </div>

        <!-- FOOTER -->
        <div class="mt-6 text-center">
            <p class="text-sm text-slate-500">
                Already have an account?
                <a href="{{ url_for('auth.login_page') }}"
                   class="font-medium text-green-700 hover:text-green-800 transition">
                   Sign in
                </a>
            </p>
        </div>

    </div>

</body>
</html>
