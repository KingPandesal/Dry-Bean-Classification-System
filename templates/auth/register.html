<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - GradeWise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<!-- Main Background: Deep Slate Blue -->
<body class="bg-slate-900 flex items-center justify-center min-h-screen antialiased selection:bg-blue-500 selection:text-white">

    <!-- Register Container -->
    <div class="w-full max-w-md p-8 bg-slate-800 rounded-2xl shadow-2xl border border-slate-700">
        
        <!-- Header Section -->
        <div class="text-center mb-8">
            <div class="mx-auto h-12 w-12 bg-blue-600 rounded-full flex items-center justify-center mb-4 shadow-lg shadow-blue-500/30">
                <!-- User Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-white">Create Account</h2>
            <p class="text-slate-400 text-sm mt-2">Join GradeWise to predict your future</p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <!-- Form -->
        <form id="auth-form" action="{{ url_for('auth.register') }}" method="POST" class="space-y-5">
            
            <!-- Name Field -->
            <div>
                <label for="name" class="block text-xs font-medium text-slate-400 uppercase tracking-wider">Full Name</label>
                <div class="mt-1">
                    <input id="name" name="name" type="text" autocomplete="name" required placeholder="John Doe"
                        class="block w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200">
                </div>
            </div>

            <!-- Username Field -->
            <div>
                <label for="username" class="block text-xs font-medium text-slate-400 uppercase tracking-wider">Username</label>
                <div class="mt-1">
                    <input id="username" name="username" type="text" autocomplete="username" required placeholder="johndoe"
                        class="block w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200">
                </div>
            </div>

            <!-- Email Address Field -->
            <div>
                <label for="email" class="block text-xs font-medium text-slate-400 uppercase tracking-wider">Email Address</label>
                <div class="mt-1">
                    <input id="email" name="email" type="email" autocomplete="email" required placeholder="john@example.com"
                        class="block w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200">
                </div>
            </div>

            <!-- Password Field -->
            <div>
                <label for="password" class="block text-xs font-medium text-slate-400 uppercase tracking-wider">Password</label>
                <div class="mt-1">
                    <input id="password" name="password" type="password" autocomplete="new-password" required placeholder="••••••••"
                        class="block w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200">
                </div>
            </div>

            <!-- Confirm Password Field -->
            <div>
                <label for="confirm-password" class="block text-xs font-medium text-slate-400 uppercase tracking-wider">Confirm Password</label>
                <div class="mt-1">
                    <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" required placeholder="••••••••"
                        class="block w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200">
                </div>
            </div>

            <!-- Terms Checkbox -->
            <!-- <div class="flex items-center">
                <input id="terms" name="terms" type="checkbox" required
                    class="h-4 w-4 bg-slate-700 border-slate-600 rounded text-blue-600 focus:ring-blue-600">
                <label for="terms" class="ml-2 block text-sm text-slate-400">
                    I agree to the <a href="#" class="text-blue-500 hover:text-blue-400">Terms</a> and <a href="#" class="text-blue-500 hover:text-blue-400">Privacy</a>
                </label>
            </div> -->

            <!-- Submit Button -->
            <button type="submit" 
                class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 focus:ring-offset-slate-800 transition duration-200">
                Create Account
            </button>
        </form>

        <!-- Divider -->
        <!-- <div class="relative my-6">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-slate-700"></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="px-4 bg-slate-800 text-slate-500">Or continue with</span>
            </div>
        </div> -->

        <!-- Social Login (Optional) -->
        <!-- <button type="button" 
            class="w-full flex justify-center items-center gap-2 py-2.5 px-4 border border-slate-700 rounded-lg bg-slate-900 text-slate-300 hover:bg-slate-800 hover:text-white transition text-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12.545 10.239v3.821h5.445c-.712 2.315-2.647 3.972-5.445 3.972a6.033 6.033 0 110-12.64c1.498 0 2.866.549 3.921 1.453l2.814-2.814A9.969 9.969 0 0012.545 2C7.021 2 2.543 6.477 2.543 12s4.478 10 10.002 10c8.396 0 10.249-7.85 9.426-11.748l-9.426-.013z"/>
            </svg>
            Continue with Google
        </button> -->

        <!-- Bottom Text -->
        <div class="mt-6 text-center">
            <p class="text-sm text-slate-400">
                Already have an account? 
                <a href="{{ url_for('auth.login_page') }}" class="font-medium text-blue-500 hover:text-blue-400 transition">Sign in</a>
            </p>
        </div>
    </div>

</body>
</html>
