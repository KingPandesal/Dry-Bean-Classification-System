<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CardioRisk AI</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<!-- Clean Medical White Background -->
<body class="bg-white flex items-center justify-center min-h-screen antialiased selection:bg-red-500 selection:text-white">

    <!-- Register Container -->
    <div class="w-full max-w-md p-8 mt-10 mb-10 bg-white rounded-2xl shadow-2xl border border-red-100">

        <!-- Header -->
        <div class="text-center mb-8">

            <div class="mx-auto h-12 w-12 bg-red-600 rounded-full flex items-center justify-center mb-4 shadow-lg shadow-red-200">

                <!-- Medical / Heart Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                </svg>

            </div>

            <h2 class="text-2xl font-bold text-slate-900">Create Account</h2>
            <p class="text-slate-500 text-sm mt-2">Join CardioRisk AI for heart disease risk prediction</p>

        </div>

        {% if error %}
        <div class="mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-red-600 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <!-- Form -->
        <form id="auth-form" action="{{ url_for('auth.register') }}" method="POST" class="space-y-5">

            <!-- Full Name -->
            <div>
                <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider">Full Name</label>
                <input name="name" type="text" required placeholder="John Doe"
                    class="mt-1 block w-full px-4 py-3 bg-white border border-red-100 rounded-lg text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 transition">
            </div>

            <!-- Username -->
            <div>
                <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider">Username</label>
                <input name="username" type="text" required placeholder="johndoe"
                    class="mt-1 block w-full px-4 py-3 bg-white border border-red-100 rounded-lg text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 transition">
            </div>

            <!-- Email -->
            <div>
                <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider">Email Address</label>
                <input name="email" type="email" required placeholder="john@example.com"
                    class="mt-1 block w-full px-4 py-3 bg-white border border-red-100 rounded-lg text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 transition">
            </div>

            <!-- Password -->
            <div>
                <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider">Password</label>
                <input name="password" type="password" required placeholder="••••••••"
                    class="mt-1 block w-full px-4 py-3 bg-white border border-red-100 rounded-lg text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 transition">
            </div>

            <!-- Confirm Password -->
            <div>
                <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider">Confirm Password</label>
                <input name="confirm-password" type="password" required placeholder="••••••••"
                    class="mt-1 block w-full px-4 py-3 bg-white border border-red-100 rounded-lg text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 transition">
            </div>

            <!-- Submit -->
            <button type="submit"
                class="w-full py-3 px-4 rounded-lg text-white font-medium bg-red-600 hover:bg-red-700 shadow-lg shadow-red-100 transition">
                Create Account
            </button>

        </form>

        <!-- Divider -->
        <!-- <div class="relative my-6">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-red-100"></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="px-4 bg-white text-slate-400">Or continue with</span>
            </div>
        </div> -->

        <!-- Google Login -->
        <!-- <button type="button"
            class="w-full flex justify-center items-center gap-2 py-2.5 px-4 border border-red-100 rounded-lg bg-white text-slate-600 hover:bg-red-50 hover:text-red-600 transition text-sm">

            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12.545 10.239v3.821h5.445c-.712 2.315-2.647 3.972-5.445 3.972a6.033 6.033 0 110-12.64c1.498 0 2.866.549 3.921 1.453l2.814-2.814A9.969 9.969 0 0012.545 2C7.021 2 2.543 6.477 2.543 12s4.478 10 10.002 10c8.396 0 10.249-7.85 9.426-11.748l-9.426-.013z"/>
            </svg>

            Continue with Google
        </button> -->

        <!-- Guest -->
        <div class="mt-4">
            <a href="{{ url_for('auth.guest') }}"
               class="w-full flex justify-center py-3 px-4 border border-red-200 rounded-lg text-sm font-medium text-red-600 hover:bg-red-50 transition">
                Continue as Guest
            </a>
        </div>

        <!-- Footer -->
        <div class="mt-6 text-center">
            <p class="text-sm text-slate-500">
                Already have an account?
                <a href="{{ url_for('auth.login_page') }}"
                   class="font-medium text-red-600 hover:text-red-700 transition">
                   Sign in
                </a>
            </p>
        </div>

    </div>

</body>
</html>
