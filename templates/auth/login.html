<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Login - PredictED</title>

    <style>
        body { font-family: 'Inter', sans-serif; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>

<!-- Main Background: Deep Slate Blue -->
<body class="bg-slate-900 flex items-center justify-center min-h-screen antialiased selection:bg-blue-500 selection:text-white">

    <!-- Login Container -->
    <div class="w-full max-w-md p-8 bg-slate-800 rounded-2xl shadow-2xl border border-slate-700">
        
        <!-- Header Section -->
        <div class="text-center mb-8">
            <div class="mx-auto h-12 w-12 bg-blue-600 rounded-full flex items-center justify-center mb-4 shadow-lg shadow-blue-500/30">
                <!-- Simple Lock Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-white">Welcome Back!</h2>
            <p class="text-slate-400 text-sm mt-2">Please enter your details to sign in.</p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <!-- Form -->
        <form id="auth-form" action="{{ url_for('auth.login') }}" method="POST" class="space-y-6">
            
            <!-- Username Field -->
            <div>
                <label for="username" class="block text-xs font-medium text-slate-400 uppercase tracking-wider">Username</label>
                <div class="mt-1">
                    <input id="username" name="username" type="text" autocomplete="username" required placeholder="Enter your username"
                        class="block w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200">
                </div>
            </div>

            <!-- Password Field -->
            <div>
                <label for="password" class="block text-xs font-medium text-slate-400 uppercase tracking-wider">Password</label>
                <div class="mt-1">
                    <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••"
                        class="block w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200">
                </div>
            </div>

            <!-- Remember & Forgot Row -->
            <!-- <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 bg-slate-700 border-slate-600 rounded text-blue-600 focus:ring-blue-600">
                    <label for="remember-me" class="ml-2 block text-sm text-slate-300">Remember me</label>
                </div>
                <div class="text-sm">
                    <a href="#" class="font-medium text-blue-500 hover:text-blue-400 transition">Forgot password?</a>
                </div>
            </div> -->

            <!-- Submit Button -->
            <button type="submit" 
                class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 focus:ring-offset-slate-800 transition duration-200">
                Sign In
            </button>
        </form>

        <!-- Continue as Guest -->
        <div class="mt-4">
            <a href="{{ url_for('auth.guest') }}"
            class="w-full flex justify-center py-3 px-4 border border-slate-600 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-700 hover:text-white transition duration-200">
                Continue as Guest
            </a>
        </div>

        <!-- Bottom Text -->
        <div class="mt-6 text-center">
            <p class="text-sm text-slate-400">
                Don't have an account? 
                <a href="{{ url_for('auth.register_page') }}" class="font-medium text-blue-500 hover:text-blue-400 transition">Register for free</a>
            </p>
        </div>
    </div>

</body>
</html>
